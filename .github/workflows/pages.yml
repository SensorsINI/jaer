# Deploy lensFOVCalculations/ as a static GitHub Pages site.
# One-time: repo Settings → Pages → Source: GitHub Actions.
# Live URL: https://sensorsini.github.io/jaer/

name: Deploy FOV calculator to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'lensFOVCalculations/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: lensFOVCalculations

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
