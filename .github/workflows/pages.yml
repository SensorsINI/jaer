# Deploy website/ to GitHub Pages. Source in repo Settings must be GitHub Actions.
# Does not publish docs/. Installer binaries stay on GitHub Releases.
# Environment github-pages allows master only. Checkout master even on a product
# tag so the deploy is not rejected. Rebake latest.json on public and rc
# releases so the landing page can offer Download Prerelease. Skip
# sample-data-current (zip-only prerelease).

name: Deploy landing page

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name != 'release' ||
      (
        github.event.release.draft == false &&
        github.event.release.tag_name != 'sample-data-current'
      )
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Bake latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 website/bake-latest.py

      - name: Drop bake script from artifact
        run: rm -f website/bake-latest.py website/README.md

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
