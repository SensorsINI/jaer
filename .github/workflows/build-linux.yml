# Unix .sh installer (production compression + shrinkRuntime). Artifacts only on workflow_dispatch — does not attach to a GitHub Release.
# Tag attach is assemble in release.yml (`workflow_call`).
# install4j 13.1 matches the Mini. 13.0.2 jlink on ubuntu produced a ~378 MB .sh vs Mini ~220 MB.
# Repo secret INSTALL4J_LICENSE (Actions → Secrets). Environment-only copies on macos-notarize /
# azure-signing are not visible here. Do not run this against 3.5.0 Latest.
# Prerequisites: .cursor/plans/ci_release_orchestration.plan.md

name: Build Linux

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Ant
        run: |
          ANT_VER=1.10.15
          curl -fsSL "https://archive.apache.org/dist/ant/binaries/apache-ant-${ANT_VER}-bin.tar.gz" \
            | tar xz -C "$HOME"
          echo "$HOME/apache-ant-${ANT_VER}/bin" >> "$GITHUB_PATH"

      - name: Check Ant
        run: ant -version

      - name: Set up install4j
        uses: luangong/setup-install4j@v1
        with:
          version: '13.1'
          license: ${{ secrets.INSTALL4J_LICENSE }}

      - name: Remove install4j setup download from workspace
        run: |
          set -euo pipefail
          echo 'setup-install4j leaves install4j_* in the checkout; dirEntry packs ..'
          ls -lh install4j_linux* install4j_macos* install4j_windows* 2>/dev/null || echo '(no install4j_* in workspace)'
          rm -f install4j_linux* install4j_macos* install4j_windows*
          test ! -e install4j_linux-x64_13_1.sh

      - name: Check install4j
        run: install4jc --version

      - name: Write install4j license
        env:
          INSTALL4J_LICENSE: ${{ secrets.INSTALL4J_LICENSE }}
        run: |
          python3 <<'PY'
          import os, pathlib, stat

          v = os.environ.get('INSTALL4J_LICENSE', '').lstrip('\ufeff').strip()
          if not v:
              raise SystemExit(
                  'Missing repository secret INSTALL4J_LICENSE '
                  '(Settings → Secrets and variables → Actions). '
                  'Secrets that exist only on Environments macos-notarize or azure-signing '
                  'are not visible to this job.'
              )
          pathlib.Path('install4j').mkdir(exist_ok=True)
          p = pathlib.Path('install4j/license.txt')
          p.write_text(v + '\n', encoding='utf-8')
          p.chmod(stat.S_IRUSR | stat.S_IWUSR)
          print('Wrote install4j/license.txt (contents not logged)')
          PY

      - name: Read VERSION.txt
        id: version
        run: |
          v=$(tr -d '[:space:]' < VERSION.txt)
          if [[ -z "$v" ]]; then echo 'VERSION.txt is empty' >&2; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "jAER version: $v"

      - name: Build Unix installer (ant release-linux)
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        run: ant release-linux

      - name: Inventory lib/ jars/ opencv slim (workspace, not the .sh)
        if: always()
        run: |
          set -euo pipefail
          echo '## Workspace after ant (what install4j can pack)'
          echo '=== lib/ largest ==='
          if [[ -d lib ]]; then find lib -type f -printf '%10s  %p\n' | sort -nr | head -40; else echo '(no lib/)'; fi
          echo '=== jars/ (git; libusb is NOT per-OS split) ==='
          if [[ -d jars ]]; then find jars -type f -printf '%10s  %p\n' | sort -nr; else echo '(no jars/)'; fi
          echo '=== OpenCV fat vs slim ==='
          ls -lh lib/opencv-4.8.1-0.jar 2>/dev/null || echo 'no fat lib/opencv-4.8.1-0.jar'
          find build/opencv-slim -name 'opencv*.jar' -printf '%10s  %p\n' 2>/dev/null || echo 'no slim jars'
          echo '=== libusb4java (all platforms currently packed into every media) ==='
          ls -lh jars/libusb4java-*.jar 2>/dev/null || true
          echo '=== dist/ ==='
          ls -lh dist/jAER.jar 2>/dev/null || true

      - name: Locate Unix installer
        id: locate
        if: always()
        run: |
          set -euo pipefail
          v='${{ steps.version.outputs.version }}'
          dir="currentInstallers/${v}"
          shopt -s nullglob
          shs=("$dir"/jAER_unix_*.sh)
          if [[ ${#shs[@]} -ne 1 ]]; then
            echo "Expected one jAER_unix_*.sh under $dir" >&2
            ls -la "$dir" >&2 || true
            exit 1
          fi
          f="${shs[0]}"
          bytes=$(stat -c%s "$f")
          mib=$((bytes / 1024 / 1024))
          echo "Unix installer: $f (${mib} MiB)"
          echo "installer_name=$(basename "$f")" >> "$GITHUB_OUTPUT"
          echo "installer_mib=${mib}" >> "$GITHUB_OUTPUT"
          echo "installer_path=$f" >> "$GITHUB_OUTPUT"

      - name: List payload inside the .sh
        if: always() && steps.locate.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 <<'PY'
          import gzip, os, re, tarfile
          from pathlib import Path

          sh = Path(os.environ['INSTALLER_SH'])
          size = sh.stat().st_size
          print(f'sh bytes={size}')
          head = sh.read_bytes()[:65536]
          text = head.decode('latin1', errors='replace')
          m = re.search(r'tail -c (\d+)', text)
          if not m:
              raise SystemExit('no tail -c N in installer stub')
          tail_len = int(m.group(1))
          off = size - tail_len
          print(f'sfx gzip offset={off} length={tail_len}')
          with sh.open('rb') as f:
              f.seek(off)
              mag = f.read(3)
          print(f'tail magic={mag.hex()}')
          members = []
          with sh.open('rb') as f:
              f.seek(off)
              with gzip.GzipFile(fileobj=f) as gz:
                  with tarfile.open(fileobj=gz, mode='r|') as tar:
                      for ent in tar:
                          if ent.isfile():
                              members.append((ent.size, ent.name))
          members.sort(key=lambda x: -x[0])
          print('=== sfx_archive largest ===')
          for sz, name in members:
              print(f'{sz:12d}  {name}')
          PY
        env:
          INSTALLER_SH: ${{ steps.locate.outputs.installer_path }}

      - name: Fail if Unix installer is oversized
        if: always() && steps.locate.outcome == 'success'
        run: |
          set -euo pipefail
          mib='${{ steps.locate.outputs.installer_mib }}'
          echo "Installer ${mib} MiB (Mini unix .sh ~220 MiB)"
          if [[ "$mib" -lt 50 ]]; then
            echo 'Installer too small; expected a bundled-JRE .sh' >&2
            exit 1
          fi
          if [[ "$mib" -gt 280 ]]; then
            echo "Installer is ${mib} MiB; expected ~220 MiB." >&2
            echo 'See Inventory and List payload steps for fat opencv / libusb / JRE natives.' >&2
            exit 1
          fi

      - name: Report jlink JRE cache
        if: always()
        run: |
          set -euo pipefail
          cache="${XDG_CACHE_HOME:-$HOME/.cache}/install4j"
          echo "install4j cache under $cache"
          find "$cache" -name '*.tar.gz' -printf '%s %p\n' 2>/dev/null | sort || true
          gen=$(find "$cache" -path '*/generated/*/linux-*.tar.gz' 2>/dev/null | head -1 || true)
          if [[ -n "$gen" ]]; then
            echo "Generated Linux JRE: $gen ($(du -h "$gen" | cut -f1))"
            echo "jmods in archive: $(tar -tzf "$gen" | grep -c '/jmods/' || true)"
            echo "src.zip in archive: $(tar -tzf "$gen" | grep -c 'src.zip' || true)"
            rel=$(tar -tzf "$gen" | grep -E '(^|/)release$' | head -1 || true)
            if [[ -n "$rel" ]]; then
              tar -xOf "$gen" "$rel" | grep -E '^(JAVA_VERSION|MODULES)=' || true
            fi
          else
            echo 'No generated linux-*.tar.gz found'
          fi

      - name: Upload Unix installer
        uses: actions/upload-artifact@v7
        with:
          name: jaer-linux
          path: currentInstallers/${{ steps.version.outputs.version }}/jAER_unix_*.sh
          if-no-files-found: error
          retention-days: 7

      - name: Wipe install4j license from the runner
        if: always()
        run: |
          rm -f install4j/license.txt
          echo 'Removed install4j/license.txt'

      - name: Summary
        if: always()
        run: |
          {
            echo '## Linux installer (dry run)'
            echo "- Version: \`${{ steps.version.outputs.version }}\`"
            echo "- Runner: \`ubuntu-latest\` / install4j 13.1"
            echo "- Installer: \`${{ steps.locate.outputs.installer_name }}\` (${{ steps.locate.outputs.installer_mib }} MiB)"
            echo '- Did **not** attach to a GitHub Release. Download artifact `jaer-linux`.'
            echo '- Filenames may still say `3_5_0`. Do not upload them onto Latest `3.5.0`.'
          } >> "$GITHUB_STEP_SUMMARY"
