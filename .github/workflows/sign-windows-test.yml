# Build Windows install4j media on GitHub-hosted runners and SignPath-sign it.
# Prerequisites (repo Settings → Secrets and variables → Actions):
#   Secrets: INSTALL4J_LICENSE, SIGNPATH_API_TOKEN
#   Variables: SIGNPATH_ORGANIZATION_ID
#   Optional variable: SIGNPATH_SIGNING_POLICY_SLUG (tag-push default if set)
# SignPath UI: GitHub App on SensorsINI/jaer, artifact config slug windows-installer-2,
# CI user "CI builds" as Submitter; your login as Approver.
# SIGNPATH_API_TOKEN must be the CI builds token (Actions has no submitter field).
# Use release-signing only after that policy is ACTIVE and the certificate is VALID
# (not CSR PENDING). See README-releasing-tagging.md.

name: Sign Windows (SignPath)

on:
  workflow_dispatch:
    inputs:
      signing_policy:
        description: SignPath signing policy slug
        type: choice
        options:
          - test-signing2
          - release-signing
        default: test-signing2
  push:
    tags:
      - '3.*'

permissions:
  actions: read
  contents: write

jobs:
  build-and-sign:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Ant is preinstalled on windows-latest runner images (no third-party setup-ant).
      - name: Check Ant
        shell: pwsh
        run: ant -version

      - name: Set up install4j
        uses: luangong/setup-install4j@v1
        with:
          version: '13.0.2'
          license: ${{ secrets.INSTALL4J_LICENSE }}

      - name: Read VERSION.txt
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content -Raw VERSION.txt).Trim()
          if (-not $v) { throw 'VERSION.txt is empty' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "jAER version: $v"

      - name: Build tagged Windows installer (verified tag)
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        run: ant "-Djaer.release.tag=${{ github.ref_name }}" release-windows-ci

      - name: Build manual Windows test installer
        if: ${{ github.ref_type != 'tag' }}
        shell: pwsh
        run: ant release-windows-ci

      - name: Locate Windows installer
        id: locate
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $dir = Join-Path 'currentInstallers' $v
          $exe = Get-ChildItem -Path $dir -Filter 'jAER_windows-x64_*.exe' -File -ErrorAction Stop |
            Select-Object -First 1
          if (-not $exe) { throw "No jAER_windows-x64_*.exe under $dir" }
          "installer_path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer_name=$($exe.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Unsigned installer: $($exe.FullName) ($([math]::Round($exe.Length/1MB,1)) MB)"

      - name: Resolve SignPath policy
        id: policy
        shell: pwsh
        run: |
          $fromInput = '${{ github.event.inputs.signing_policy }}'
          $fromVar = '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'
          $policy = if ($fromInput) { $fromInput } elseif ($fromVar) { $fromVar } else { 'test-signing2' }
          "slug=$policy" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "SignPath signing-policy-slug: $policy"

      - name: Upload unsigned installer for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.locate.outputs.installer_path }}
          if-no-files-found: error
          # Raw PE (not ZIP) so SignPath root element can be pe-file. name is ignored when archive is false.
          archive: false

      - name: Submit SignPath signing request
        id: signpath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: jaer
          signing-policy-slug: ${{ steps.policy.outputs.slug }}
          artifact-configuration-slug: windows-installer-2
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          service-unavailable-timeout-in-seconds: 600
          skip-decompress: true
          output-artifact-directory: ${{ github.workspace }}/signed
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      - name: Upload signed installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: jaer-windows-signed
          path: signed/**
          if-no-files-found: error

      - name: Attach signed installer to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: signed/**
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## SignPath Windows signing
          - Version: `${{ steps.version.outputs.version }}`
          - Policy: `${{ steps.policy.outputs.slug }}`
          - Unsigned: `${{ steps.locate.outputs.installer_name }}`
          - Signing request: ${{ steps.signpath.outputs.signing-request-web-url }}
          - Signed download: ${{ steps.signpath.outputs.signed-artifact-download-url }}
          - Note: approve the request in SignPath UI if the job waits on approval.
          - Mac/Linux installers: local ``ant release`` then ``scripts/upload-github-release-installers.ps1``.
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY
