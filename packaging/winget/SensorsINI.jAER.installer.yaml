# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
# Fill InstallerSha256 from Get-FileHash after the exe is on GitHub Releases.
# After SignPath release-signing, set Publisher in the locale file to "SignPath Foundation".
PackageIdentifier: SensorsINI.jAER
PackageVersion: 3.2.0
Platform:
  - Windows.Desktop
MinimumOSVersion: 10.0.17763.0
InstallerType: exe
Scope: machine
InstallModes:
  - interactive
  - silent
  - silentWithProgress
InstallerSwitches:
  Silent: -q
  SilentWithProgress: -splash "Installing jAER"
UpgradeBehavior: install
ReleaseDate: 2026-08-16
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/SensorsINI/jaer/releases/download/3.2.0/jAER_windows-x64_3_2_0.exe
    InstallerSha256: REPLACE_WITH_SHA256_OF_GITHUB_RELEASE_ASSET
    # ProductCode is assigned by install4j; leave empty until a local install is inspected.
ManifestType: installer
ManifestVersion: 1.6.0
