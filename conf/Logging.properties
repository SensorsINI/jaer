# this logging configuration is used by jAER when running the application by specifying
# -Djava.util.logging.config.file=conf/Logging.properties in the java machine invocation

# Specify the handlers to create in the root logger

# Set the default logging level for the root logger, e.g. WARNING INFO, FINE, FINER, FINEST
# This filters all subsequent levels so set to FINEST and then filter out later
# NOTE: if set to FINE, jaer will not start because of logging from jogl or other classes
.level = INFO

# (all loggers are children of the root logger)
# FileHandler uses %g rotation. append=true conflicts with that: JUL skips
# rotate-on-open and meters only this JVM's new bytes, so files grow past
# limit. append=false: each start shifts jAER-0.log → jAER-1.log (last session
# kept for crash reports), then writes a new jAER-0.log; size limit still
# rotates during the run. JaerTmpdirLogBootstrap mkdirs %t/jaer first.
handlers = net.sf.jaer.util.JaerTmpdirLogBootstrap, java.util.logging.ConsoleHandler, java.util.logging.FileHandler


# SET THE JAER default logging level here
# Set the logging level for all jaer classes that use the logger "net.sf.jaer"
# TEMP 2026-08-25: FINE to file for USB open/ISSD/DVX SPI hangs. Do not set
# root .level=FINE (JOGL floods and jAER may not start). Console stays INFO.
net.sf.jaer.level=FINE
ch.unizh.ini.jaer.level=FINE
prophesee.level=FINE
# stderr ConsoleHandler (install4j / ant run)
java.util.logging.ConsoleHandler.level=INFO
# In-app Console window (AEViewerLoggingHandler is added in code, not via handlers=).
# LogManager applies this only if the handler constructor reads it — see AEViewerLoggingHandler.
net.sf.jaer.graphics.AEViewerLoggingHandler.level=INFO


# The following special tokens can be used in the pattern property
# which specifies the location and name of the log file.
#   / - standard path separator
#   %t - system temporary directory
#   %h - value of the user.home system property (home folder, e.g. c:\Users\<username>\ or /home/<username>)
#   %g - generation number for rotating logs
#   %u - unique number to avoid conflicts
# jAER-owned temps live under %t/jaer/ (see JaerTmpdir); do not put logs in %t root.
java.util.logging.FileHandler.pattern=%t/jaer/jAER-%g.log
# TEMP 2026-08-25: FINE file log (console remains INFO).
java.util.logging.FileHandler.level = FINE
java.util.logging.FileHandler.limit = 5242880
java.util.logging.FileHandler.count = 5
java.util.logging.FileHandler.append = false

# Set the default formatter for new ConsoleHandler instances
#java.util.logging.ConsoleHandler.formatter = net.sf.jaer.util.JAERConsoleLoggingFormatter
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.ConsoleHandler.formatter = net.sf.jaer.util.LoggingAnsiColorConsoleFormatter

